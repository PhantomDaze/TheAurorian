modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/PhantomDaze/TheAurorian/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "${mod_link}"
logoFile = "banner.png"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[9.0.0+1.21.1,)"
ordering = "NONE"
side = "BOTH"

# Optional integrations: CraftTweaker and Patchouli both ship 1.21.1 NeoForge builds.
# TConstruct has no stable 1.21.1 release yet — the range below is for the 3.x API used by
# Compat/TinkersConstruct, and should be raised to the 4.x range when it ships.
[[dependencies.${mod_id}]]
modId = "crafttweaker"
type = "optional"
versionRange = "[21.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "patchouli"
type = "optional"
versionRange = "[1.21.1-90,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tconstruct"
type = "optional"
versionRange = "[3.8.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mantle"
type = "optional"
versionRange = "[1.10.0,)"
ordering = "NONE"
side = "BOTH"
