modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "${mod_link}"
description = '''${mod_description}'''
logoFile = "banner.png"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
mandatory = true
versionRange = "[1.19.2-5.1.4.1,)"
ordering = "NONE"
side = "BOTH"

# Optional integrations: TConstruct, CraftTweaker, Patchouli (and TConstruct's library Mantle)
[[dependencies.${mod_id}]]
modId = "tconstruct"
mandatory = false
versionRange = "[3.8.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mantle"
mandatory = false
versionRange = "[1.10.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "crafttweaker"
mandatory = false
versionRange = "[10.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "patchouli"
mandatory = false
versionRange = "[1.19.2-76,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
