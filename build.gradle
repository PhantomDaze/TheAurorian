plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            workingDirectory project.file('run/server')
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        // Curios
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // JEI
        url = "https://maven.blamejared.com"
    }
    maven {
        // CurseForge
        url = "https://cursemaven.com"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Geckolib
    implementation fg.deobf("curse.maven:geckolib-388172:4407241")

    // Curios
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // JEI
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // AppleSkin
    implementation fg.deobf("curse.maven:appleskin-248787:3872808")

    // Neat
    implementation fg.deobf("curse.maven:neat-238372:3878735")

	// Enchantment Descriptions
	implementation fg.deobf("curse.maven:bookshelf-228525:4556697")
    implementation fg.deobf("curse.maven:enchantment-descriptions-250419:5015022")

    // Effortless building (for making stuctures)
    implementation fg.deobf("curse.maven:effortless-building-302113:4810762")

    // Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Unit / resource tests (no full game bootstrap required)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_link               : mod_link
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---- Automated tests -------------------------------------------------------
// 1) validateResources — pure Python datapack/asset integrity gate (fast, CI-friendly)
// 2) test — JUnit 5 unit tests + resource/datapack smoke tests

tasks.register('validateResources', Exec) {
    group = 'verification'
    description = 'Validate datapack/asset integrity (lang, loot, structures, mirror, advancements, registries).'
    workingDir = project.projectDir
    commandLine 'python3', 'scripts/validate_resources.py'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Resource integrity also runs via ResourceIntegrityTest; keep explicit task for CI scripts.
    dependsOn tasks.named('validateResources')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// Make `check` (and therefore a careful `build`) run the resource gate even if tests are skipped later.
tasks.named('check').configure {
    dependsOn tasks.named('validateResources')
}