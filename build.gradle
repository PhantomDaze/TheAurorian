plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Diagnostics for the random SIGKILL (exit 137): heap dump + GC log + JVM error file.
            // NOTE: no mixin.debug.* flags on purpose - they perturb mixin application order and
            // trigger spurious injector failures in co-installed optimization mods (Canary/C2ME/ModernFix).
            def runDir = file('run').absolutePath
            jvmArg '-Xmx6G'
            jvmArg '-XX:+HeapDumpOnOutOfMemoryError'
            jvmArg "-XX:HeapDumpPath=${runDir}/hs_err_pid%p.hprof"
            jvmArg "-XX:ErrorFile=${runDir}/hs_err_pid%p.log"
            jvmArg "-Xlog:gc*:file=${runDir}/gc.log:time,uptime,level,tags"
            property 'forge.logging.markers', 'REGISTRIES,SCAN'
        }

        server {
            workingDirectory project.file('run/server')
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }

        // Headless in-world GameTest server (functional tests)
        gameTestServer {
            workingDirectory project.file('run/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'forge.enableGameTest', 'true'
            property 'forge.gameTestServer', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        // Curios
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // JEI, CraftTweaker, Patchouli
        url = "https://maven.blamejared.com"
    }
    maven {
        // TConstruct, Mantle
        url = "https://dvs1.progwml6.com/files/maven"
    }
    maven {
        // CurseForge
        url = "https://cursemaven.com"
    }
    flatDir {
        // c2meF (C2ME Forge port) is Modrinth-only; pinned locally so fg.deobf can remap it
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Geckolib 4.x for 1.20.1 (kept for future animated entities; not currently referenced in Java)
    implementation fg.deobf("curse.maven:geckolib-388172:8285794")

    // Curios
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // JEI
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Tinkers' Construct (optional soft dependency)
    compileOnly fg.deobf("slimeknights.tconstruct:TConstruct:${tconstruct_version}")
    compileOnly fg.deobf("slimeknights.mantle:Mantle:${mantle_version}")
    // Runtime (test client): the dev client is Mojang-mapped, so production jars must be
    // added via fg.deobf (ForgeGradle remaps them) instead of dropping them into run/mods.
    runtimeOnly fg.deobf("slimeknights.tconstruct:TConstruct:${tconstruct_version}")
    runtimeOnly fg.deobf("slimeknights.mantle:Mantle:${mantle_version}")

    // CraftTweaker (optional soft dependency)
    compileOnly fg.deobf("com.blamejared.crafttweaker:CraftTweaker-forge-1.20.1:${crafttweaker_version}")
    annotationProcessor "com.blamejared.crafttweaker:Crafttweaker_Annotation_Processors:${crafttweaker_annotation_version}"
    runtimeOnly fg.deobf("com.blamejared.crafttweaker:CraftTweaker-forge-1.20.1:${crafttweaker_version}")

    // Patchouli (optional soft dependency)
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")

    // ---- Test client optimization mods (dev runtime only, never bundled into the mod) ----
    // Sodium/Embeddium removed - its Window/context mixins caused window close + hang on
    // this virtualized NVIDIA desktop. Vanilla rendering is used instead.
    // Lithium -> Canary (active Forge port)
    runtimeOnly fg.deobf("curse.maven:canary-665658:5089991")
    // C2ME -> c2meF (active Forge port, Modrinth-only; local flatDir jar remapped by fg.deobf)
    runtimeOnly fg.deobf("c2mef:c2mef:0.2.0")

    // Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Unit / resource tests (no full game bootstrap required)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_link               : mod_link
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---- Automated tests -------------------------------------------------------
// 1) validateResources — pure Python datapack/asset integrity gate (fast, CI-friendly)
// 2) test — JUnit 5 unit tests + resource/datapack smoke tests

tasks.register('validateResources', Exec) {
    group = 'verification'
    description = 'Validate datapack/asset integrity (lang, loot, structures, mirror, advancements, registries).'
    workingDir = project.projectDir
    commandLine 'python3', 'scripts/validate_resources.py'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Resource integrity also runs via ResourceIntegrityTest; keep explicit task for CI scripts.
    dependsOn tasks.named('validateResources')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// Make `check` (and therefore a careful `build`) run the resource gate even if tests are skipped later.
tasks.named('check').configure {
    dependsOn tasks.named('validateResources')
}
