plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'TinkersConstruct'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 for 1.21.x
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // AT auto-detected at META-INF/accesstransformer.cfg

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Auto superflat + place 3 boss structures for layout inspection.
        // Prefer: ./scripts/run_structure_layout_test.sh  or  Gradle task runClientStructureLayout
        clientStructureLayout {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'theaurorian.structureLayoutTest', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit tests that touch Minecraft classes (SimpleTimer/Mth, etc.)
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios (required)
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // JEI (compile API + local runtime for dev)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // CraftTweaker (optional soft dependency; 1.21.1 neoforge build exists)
    compileOnly "com.blamejared.crafttweaker:CraftTweaker-neoforge-${minecraft_version}:${crafttweaker_version}"
    annotationProcessor "com.blamejared.crafttweaker:Crafttweaker_Annotation_Processors:${crafttweaker_annotation_version}"
    runtimeOnly "com.blamejared.crafttweaker:CraftTweaker-neoforge-${minecraft_version}:${crafttweaker_version}"

    // Patchouli (optional soft dependency; 1.21.1 neoforge build exists)
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Geckolib optional runtime (not required for content; kept for future meshes)
    localRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Gson comes transitively from Minecraft via neoForge.unitTest { enable() }
}

// Tinkers' Construct has no stable 1.21.1 release yet. Keep Compat/TinkersConstruct out of the
// build (it references TConstruct 3.x APIs) until a real version is pinned in gradle.properties.
def tconstructEnabled = project.tconstruct_version != null && !project.tconstruct_version.isEmpty()
if (!tconstructEnabled) {
    sourceSets.main.java.exclude 'shiroroku/theaurorian/Compat/TinkersConstruct/**'
} else {
    dependencies {
        compileOnly "slimeknights.tconstruct:TConstruct:${project.tconstruct_version}"
        compileOnly "slimeknights.mantle:Mantle:${project.mantle_version}"
        runtimeOnly "slimeknights.tconstruct:TConstruct:${project.tconstruct_version}"
        runtimeOnly "slimeknights.mantle:Mantle:${project.mantle_version}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_link               : mod_link,
            curios_version         : curios_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---- Automated tests -------------------------------------------------------
tasks.register('validateRunestoneLayout', Exec) {
    group = 'verification'
    description = 'Validate Runestone quadrant offsets, swap mapping, and template geometry.'
    workingDir = project.projectDir
    commandLine 'python3', 'scripts/validate_runestone_layout.py'
}

tasks.register('validateDungeonLayout', Exec) {
    group = 'verification'
    description = 'Validate Darkstone and Moon Temple upstream offsets and template geometry.'
    workingDir = project.projectDir
    commandLine 'python3', 'scripts/validate_dungeon_layout.py'
}

tasks.register('validateResources', Exec) {
    group = 'verification'
    description = 'Validate datapack/asset integrity (lang, loot, structures, mirror, advancements, registries).'
    workingDir = project.projectDir
    commandLine 'python3', 'scripts/validate_resources.py'
}


// Pre-launch: wipe previous structure-layout test world under run/saves/
tasks.register('prepareStructureLayoutTest', Exec) {
    group = 'verification'
    description = 'Delete run/saves/ta_structure_layout so the next clientStructureLayout run starts fresh.'
    workingDir = project.projectDir
    commandLine 'bash', 'scripts/prepare_structure_layout_test.sh'
}

// MDG generates runClientStructureLayout from runs.clientStructureLayout.
// Always wipe the previous test world before that client starts.
afterEvaluate {
    def runTask = tasks.findByName('runClientStructureLayout')
    if (runTask != null) {
        runTask.group = 'neoforge'
        runTask.description = 'Wipe ta_structure_layout, launch client, auto-create superflat and place 3 boss structures.'
        runTask.dependsOn tasks.named('prepareStructureLayoutTest')
    } else {
        logger.warn('runClientStructureLayout task not found — structure layout harness will not auto-clean the world')
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    dependsOn tasks.named('validateResources')
    dependsOn tasks.named('validateRunestoneLayout')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('validateResources')
    dependsOn tasks.named('validateRunestoneLayout')
}
